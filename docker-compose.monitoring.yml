version: '3.8'

services:
  # cAdvisor собирает метрики со всех запущенных Docker-контейнеров (включая твой Flask)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: always

  # База данных временных рядов Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    restart: always

  # Визуализатор Grafana (интерфейс с графиками)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '3000:3000' # Будет доступна на порту 3000
    restart: always