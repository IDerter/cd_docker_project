apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: flask-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-app-deployment
  minReplicas: 2 # Минимальное количество контейнеров
  maxReplicas: 10 # Максимальное количество при жесткой нагрузке
  targetCPUUtilizationPercentage: 50 # Если контейнеры загружены по CPU более чем на 50%, K8s создаст новые поды